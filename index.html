<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gulf Theater SITREP — Iranian Projectile Launches</title>
  <meta name="description" content="Iranian projectile launch tracking dashboard — UAE, KSA, Qatar. Updated daily." />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f5f0e8; }
    #root { min-height: 100vh; }
    .loading { display:flex; align-items:center; justify-content:center; height:100vh;
               font-family:Georgia,serif; font-size:18px; color:#8B1A1A; }
  </style>

  <!-- React 18 -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

  <!-- PropTypes (required by Recharts) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>

  <!-- Recharts via jsDelivr -->
  <script src="https://cdn.jsdelivr.net/npm/recharts@2.7.2/umd/Recharts.js"></script>

  <!-- Babel standalone — transpiles JSX in-browser -->
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.3/babel.min.js"></script>

  <!-- Data (auto-updated daily by scheduled task) -->
  <script src="gulf-data.js"></script>
</head>
<body>
  <div id="root"><div class="loading">Loading SITREP…</div></div>

  <script type="text/babel">
    const {
      LineChart, Line, XAxis, YAxis, CartesianGrid,
      Tooltip, Legend, ResponsiveContainer
    } = window.Recharts;

    // ── Read live data from gulf-data.js ──────────────────────────────────────
    const { UAE, KSA, QAT, asOfDate, updatedDate } = window.SITREP;

    // ── Colour palette ─────────────────────────────────────────────────────────
    const C = {
      bg:"#f5f0e8", cardBg:"#ffffff", border:"#d4c9b8", tableHdr:"#e2d9c8",
      rowAlt:"#f0ebe1", crimson:"#8B1A1A", brightCrimson:"#C41230",
      navy:"#1B3D7A", olive:"#7A5C1E", green:"#1A6B3C", red:"#C41230",
      amber:"#8B6914", amberBg:"#FFF3CD", amberBorder:"#D4A017",
      teal:"#0D5F5F", gray:"#888888", text:"#1a1a1a", sub:"#5a5a5a",
    };

    const TH = {
      padding:"9px 13px", fontSize:10, fontWeight:"bold", letterSpacing:"0.08em",
      textTransform:"uppercase", fontFamily:"sans-serif", color:C.sub,
      borderBottom:`1px solid ${C.border}`,
    };
    const TD = { padding:"9px 13px", borderBottom:"1px solid #e8e0d0", verticalAlign:"middle" };

    // ──── Computed chart data ──────────────────────────────────────────────────────────────
    const CONFIRMED = UAE.filter(r => !r.pending);
    const CHART = CONFIRMED.map((r, i) => {
      const k = KSA[i] || {}; const q = QAT[i] || {};
      return {
        name: r.date,
        "UAE": r.total, "KSA": k.total||0, "Qatar": q.total||0,
        "Gulf Total": r.total + (k.total||0) + (q.total||0),
        "Ballistic Missiles": r.bm + (k.bm||0) + (q.bm||0),
        "Drones / UAVs": r.uav + (k.uav||0) + (q.uav||0),
        "Cruise Missiles": r.cm + (k.cm||0) + (q.cm||0),
      };
    });

    function sumSeries(rows) {
      const c = rows.filter(r => !r.pending);
      return {
        bm:    c.reduce((s,r)=>s+(r.bm||0),0),
        cm:    c.reduce((s,r)=>s+(r.cm||0),0),
        uav:   c.reduce((s,r)=>s+(r.uav||0),0),
        total: c.reduce((s,r)=>s+(r.total||0),0),
      };
    }
    const T = { uae: sumSeries(UAE), ksa: sumSeries(KSA), qat: sumSeries(QAT) };
    const GRAND = {
      bm:    T.uae.bm+T.ksa.bm+T.qat.bm,
      cm:    T.uae.cm+T.ksa.cm+T.qat.cm,
      uav:   T.uae.uav+T.ksa.uav+T.qat.uav,
      total: T.uae.total+T.ksa.total+T.qat.total,
    };

    // ──── Sub-components ────────────────────────────────────────────────────────────────
    function Delta({ v }) {
      if (v === null || v === undefined) return null;
      if (v === 0) return <span style={{color:C.gray,fontSize:10,marginLeft:4,fontFamily:"sans-serif"}}>● 0</span>;
      const up = v > 0;
      return <span style={{color:up?C.green:C.red,fontSize:10,marginLeft:4,fontFamily:"sans-serif"}}>{up?"▲":"▼"}{Math.abs(v)}</span>;
    }

    function StatCard({ value, label, sub, color }) {
      return (
        <div style={{background:C.cardBg,border:`1px solid ${C.border}`,borderRadius:4,padding:"18px 20px",flex:1,minWidth:130}}>
          <div style={{fontSize:48,fontWeight:"bold",color,lineHeight:1,fontFamily:"Georgia,serif"}}>{value}</div>
          <div style={{fontSize:13,fontWeight:"bold",marginTop:7,color:C.text}}>{label}</div>
          <div style={{fontSize:11,color:C.gray,marginTop:3,fontStyle:"italic"}}>{sub}</div>
        </div>
      );
    }

    function SectionLabel({ children }) {
      return (
        <div style={{fontSize:10,fontWeight:"bold",letterSpacing:"0.15em",color:C.crimson,
          textTransform:"uppercase",borderTop:`2px solid ${C.crimson}`,
          paddingTop:8,marginBottom:14,fontFamily:"sans-serif"}}>{children}</div>
      );
    }

    function EstBadge() {
      return <span style={{fontSize:8,fontFamily:"sans-serif",fontWeight:"bold",letterSpacing:"0.06em",
        color:"#5a3a00",background:"#fff0cc",padding:"1px 5px",borderRadius:2,
        border:"1px solid #d4a017",marginLeft:6,verticalAlign:"middle"}}>EST.</span>;
    }

    function PendingBadge() {
      return <span style={{fontSize:8,fontFamily:"sans-serif",fontWeight:"bold",letterSpacing:"0.06em",
        color:C.amber,background:C.amberBg,padding:"1px 5px",borderRadius:2,
        border:`1px solid ${C.amberBorder}`,marginLeft:6,verticalAlign:"middle"}}>PENDING</span>;
    }

    function CountryTable({ rows, label, flagEmoji, accentColor, footnote, totals, showEstBadge }) {
      return (
        <div style={{marginBottom:28}}>
          <div style={{display:"flex",alignItems:"center",gap:10,background:accentColor,color:"white",
            padding:"8px 16px",borderRadius:"4px 4px 0 0",fontFamily:"sans-serif",fontSize:12,
            fontWeight:"bold",letterSpacing:"0.08em"}}>
            <span style={{fontSize:18}}>{flagEmoji}</span>
            <span>{label}</span>
            <span style={{fontSize:8,background:"rgba(255,255,255,0.25)",padding:"2px 6px",borderRadius:2,letterSpacing:"0.1em"}}>
              {showEstBadge ? "ESTIMATED — OPEN SOURCE" : "CONFIRMED — UAE MOD / LWJ"}
            </span>
          </div>
          <div style={{border:`1px solid ${C.border}`,borderTop:"none",borderRadius:"0 0 4px 4px",overflow:"hidden"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
              <thead>
                <tr style={{background:C.tableHdr}}>
                  <th style={{...TH,textAlign:"left"}}>Date</th>
                  <th style={{...TH,textAlign:"right"}}>Ballistic Missiles</th>
                  <th style={{...TH,textAlign:"right"}}>Cruise Missiles</th>
                  <th style={{...TH,textAlign:"right"}}>Drones / UAVs</th>
                  <th style={{...TH,textAlign:"right",background:"#d9d0bc"}}>Daily Total</th>
                </tr>
              </thead>
              <tbody>
                {rows.map((r, i) => (
                  <tr key={r.date} style={{background:i%2===0?C.cardBg:C.rowAlt}}>
                    <td style={TD}>
                      <span style={{fontWeight:"bold"}}>{r.date}</span>
                      <span style={{fontSize:10,color:C.gray,marginLeft:7,fontFamily:"sans-serif"}}>{r.day}</span>
                      {r.pending && <PendingBadge />}
                      {!r.pending && showEstBadge && <EstBadge />}
                    </td>
                    <td style={{...TD,textAlign:"right"}}>
                      {r.pending ? <span style={{color:C.gray}}>—</span>
                        : <><span style={{fontWeight:500,color:r.bm===0?C.gray:"inherit"}}>{r.bm}</span><Delta v={r.bmD}/></>}
                    </td>
                    <td style={{...TD,textAlign:"right"}}>
                      {r.pending ? <span style={{color:C.gray}}>—</span>
                        : <><span style={{fontWeight:500,color:r.cm===0?C.gray:"inherit"}}>{r.cm}</span><Delta v={r.cmD}/></>}
                    </td>
                    <td style={{...TD,textAlign:"right"}}>
                      {r.pending ? <span style={{color:C.gray}}>—</span>
                        : <><span style={{fontWeight:500,color:r.uav===0?C.gray:"inherit"}}>{r.uav}</span><Delta v={r.uavD}/></>}
                    </td>
                    <td style={{...TD,textAlign:"right",background:i%2===0?"#f7f2e8":"#ede7d6"}}>
                      {r.pending ? <span style={{color:C.gray}}>—</span>
                        : <><span style={{fontWeight:"bold",fontSize:14}}>{r.total}</span><Delta v={r.totD}/></>}
                    </td>
                  </tr>
                ))}
                <tr style={{background:"#dbd2c0",borderTop:`2px solid ${C.border}`}}>
                  <td style={{...TD,fontWeight:"bold",fontSize:10,letterSpacing:"0.1em",fontFamily:"sans-serif",color:C.sub}}>
                    PERIOD TOTAL <span style={{fontWeight:"normal",color:C.gray}}>D+0–D+{rows.length-1}</span>
                  </td>
                  <td style={{...TD,textAlign:"right",fontWeight:"bold",color:C.navy,fontSize:15}}>{totals.bm}</td>
                  <td style={{...TD,textAlign:"right",fontWeight:"bold",color:C.olive,fontSize:15}}>{totals.cm}</td>
                  <td style={{...TD,textAlign:"right",fontWeight:"bold",color:C.crimson,fontSize:15}}>{totals.uav}</td>
                  <td style={{...TD,textAlign:"right",fontWeight:"bold",color:C.brightCrimson,fontSize:15,background:"#d0c8b4"}}>{totals.total}</td>
                </tr>
              </tbody>
            </table>
          </div>
          {footnote && (
            <div style={{fontSize:10,color:C.gray,marginTop:6,lineHeight:1.55,fontFamily:"sans-serif",fontStyle:"italic"}}>
              {footnote}
            </div>
          )}
        </div>
      );
    }

    function AssessCard({ title, body, color }) {
      return (
        <div style={{flex:1,minWidth:260,background:C.cardBg,border:`1px solid ${C.border}`,borderRadius:4,padding:"16px 20px"}}>
          <div style={{fontSize:10,fontWeight:"bold",letterSpacing:"0.12em",color:color||C.crimson,textTransform:"uppercase",marginBottom:8,fontFamily:"sans-serif"}}>{title}</div>
          <p style={{fontSize:13,lineHeight:1.65,color:C.text,margin:0}}>{body}</p>
        </div>
      );
    }

    function MetricBox({ value, label }) {
      return (
        <div style={{textAlign:"center",flex:1}}>
          <div style={{fontSize:30,fontWeight:"bold",color:C.crimson,lineHeight:1,fontFamily:"Georgia,serif"}}>{value}</div>
          <div style={{fontSize:11,color:C.gray,marginTop:4,fontFamily:"sans-serif"}}>{label}</div>
        </div>
      );
    }

    // ──── Main dashboard ────────────────────────────────────────────────────────────────
    function SituationReport() {
      return (
        <div style={{background:C.bg,minHeight:"100vh",fontFamily:"Georgia,serif",color:C.text,padding:"32px 24px"}}>
          <div style={{maxWidth:1020,margin:"0 auto"}}>

            {/* HEADER */}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}}>
              <div>
                <h1 style={{margin:0,fontSize:34,fontWeight:"bold",letterSpacing:"-0.01em"}}>Situation Report</h1>
                <div style={{fontSize:13,color:C.sub,fontStyle:"italic",marginTop:5}}>
                  Iranian Projectile Launches — Gulf Theater (UAE · KSA · Qatar) — Daily Count
                </div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{background:C.crimson,color:"white",padding:"6px 14px",fontSize:12,fontWeight:"bold",letterSpacing:"0.08em",fontFamily:"sans-serif",borderRadius:2}}>
                  AS OF {asOfDate}
                </div>
                <div style={{fontSize:11,color:C.gray,marginTop:6,fontFamily:"sans-serif"}}>D+0 = 28 Feb 2026</div>
              </div>
            </div>

            <hr style={{border:"none",borderTop:`1px solid ${C.border}`,margin:"12px 0 10px"}} />

            {/* SOURCES */}
            <div style={{fontSize:10,color:C.sub,letterSpacing:"0.05em",marginBottom:10,fontFamily:"sans-serif"}}>
              SOURCE: UAE MOD (@modgovae) · Qatar MOD (@modqatar) · Saudi Arabia MOD (MoD_Saudi) · Long War Journal · The National · Gulf News · CENTCOM (@CENTCOM)
            </div>
            <div style={{fontSize:10,color:C.amber,letterSpacing:"0.04em",marginBottom:26,fontFamily:"sans-serif",fontStyle:"italic"}}>
              ⚠ KSA and Qatar figures are open-source estimates. UAE figures are confirmed. All data unclassified.
            </div>

            {/* STAT CARDS */}
            <div style={{fontSize:10,fontWeight:"bold",letterSpacing:"0.12em",color:C.sub,textTransform:"uppercase",fontFamily:"sans-serif",marginBottom:10}}>
              Gulf Theater — Combined Period Totals
            </div>
            <div style={{display:"flex",gap:14,marginBottom:8,flexWrap:"wrap"}}>
              <StatCard value={GRAND.bm}    label="Ballistic Missiles" sub="UAE confirmed + KSA/Qatar est." color={C.navy} />
              <StatCard value={GRAND.cm}    label="Cruise Missiles"    sub="UAE 15 confirmed + Qatar 2 confirmed (17 total)"     color={C.olive} />
              <StatCard value={GRAND.uav}   label="Drones / UAVs"      sub="UAE · KSA · Qatar combined"    color={C.crimson} />
              <StatCard value={GRAND.total} label="Gulf Total"          sub="confirmed + estimated"          color={C.brightCrimson} />
            </div>

            {/* Theater mini-bar */}
            <div style={{display:"flex",gap:8,marginBottom:34,flexWrap:"wrap"}}>
              {[
                {flag:"🇦🇪",label:"UAE",  val:T.uae.total,color:C.navy,   note:"confirmed"},
                {flag:"🇸🇦",label:"KSA",  val:T.ksa.total,color:"#1a6b3c",note:"estimated"},
                {flag:"🇶🇦",label:"Qatar",val:T.qat.total,color:C.teal,   note:"estimated"},
              ].map(c => (
                <div key={c.label} style={{background:C.cardBg,border:`1px solid ${C.border}`,borderRadius:4,padding:"10px 18px",display:"flex",alignItems:"center",gap:10}}>
                  <span style={{fontSize:20}}>{c.flag}</span>
                  <div>
                    <span style={{fontWeight:"bold",fontSize:20,color:c.color,fontFamily:"Georgia,serif"}}>{c.val}</span>
                    <span style={{fontSize:12,color:C.sub,marginLeft:6}}>{c.label}</span>
                    <div style={{fontSize:10,color:C.gray,fontFamily:"sans-serif",fontStyle:"italic"}}>{c.note}</div>
                  </div>
                </div>
              ))}
            </div>

            {/* TABLES */}
            <SectionLabel>Daily Launch Tables by Theater — 28 Feb – Present</SectionLabel>

            <CountryTable rows={UAE} label="UNITED ARAB EMIRATES THEATER" flagEmoji="🇦🇪"
              accentColor={C.navy} showEstBadge={false} totals={T.uae}
              footnote="BM daily series confirmed by LWJ citing UAE MOD directly. CM attribution: Feb 28 (2) + Mar 2 (6) + Mar 11 (7) per UAE MOD statement sequencing; all 15 confirmed intercepted. Drone counts differenced from UAE MOD cumulative snapshots. UAE MOD cumulative as of D+24: 357 BM, 15 CM, 1,806 UAVs engaged. D+23: 7 BM + 16 drones — Abu Dhabi debris incident injured Indian national. D+24: 5 BM + 17 drones — cumulative totals confirmed by UAE MOD. D+25: 3 BM + 9 drones — lowest UAE daily total since D+15 (10). D+23–D+25 trajectory shows resumed BM decline (7→5→3) after D+22–D+23 uptick. Trump postponed 48-hr Hormuz ultimatum D+23 for 5 days citing 'productive talks'; Iran denied negotiations. US sent 15-point peace plan via Pakistan D+24. Civilian toll: 8 KIA (2 military, 6 civilian) / 161 WIA." />

            <CountryTable rows={KSA} label="KINGDOM OF SAUDI ARABIA THEATER" flagEmoji="🇸🇦"
              accentColor="#1a6b3c" showEstBadge={true} totals={T.ksa}
              footnote="Saudi MOD spokesperson (Maj Gen Turki Al-Malki) confirmed intercepts only. D+22: 3 BM toward Riyadh Province (1 intercepted, 2 fell uninhabited) + 21 drones Eastern Region = 24 total. D+23: 2 BM targeting Riyadh (1 intercepted, 1 fell inhabited area per Sharjah24) + 18 drones across multiple Eastern Province waves (Saudi MOD / Gulf Insider / VoE) = 20 total. D+24: 1 BM + 12 drones = 13 total. D+25: 1 BM (debris fell on houses, Eastern Province) + 24 drones (3+21 in waves, Eastern Province per Saudi MOD/SPA/Peninsula Qatar) = 25 total. D+25 drone surge (24) highest single-day KSA drone count since D+16 (60). Kuwait airport fuel tank hit by drone D+25 — regional spillover continues. Figures are minimum confirmed — additional unannounced engagements likely. No CMs reported toward KSA." />

            <CountryTable rows={QAT} label="QATAR THEATER — AL UDEID AB" flagEmoji="🇶🇦"
              accentColor={C.teal} showEstBadge={true} totals={T.qat}
              footnote="Qatar MOD confirmed intercepts only. D+16: 14 BM (13 intercepted, 1 fell in uninhabited area), 'several drones' intercepted — exact drone count not stated (Qatar MOD via Gulf News / QNA). D+17: Qatar MOD confirmed interception of two separate missile attacks — specific daily totals not stated (Gulf News). D+18: Qatar MOD confirmed 5 BM (4 intercepted, 1 fell in Ras Laffan Industrial City causing fire and 'significant damage'). D+19–D+25: Attacks continued per LWJ / Al Jazeera but no specific Qatar MOD daily figures available — marked pending. QatarEnergy force majeure on all LNG since D+4. Qatar expelled Iranian military/security attaches D+19 (Gulf News). 2 CMs reported toward Qatar (D+12, D+13); no additional CMs confirmed by Qatar MOD. 5-day diplomatic window (D+23–D+28) following Trump Hormuz ultimatum postponement has not reduced Qatar-axis attacks per LWJ reporting." />

            {/* CHART */}
            <div style={{marginBottom:36}}>
              <SectionLabel>Daily Launch Volume — Gulf Theater Combined</SectionLabel>
              <div style={{fontSize:11,color:C.sub,fontFamily:"sans-serif",marginBottom:10}}>
                Solid line = Gulf Total. Dashed lines = category breakdown across all three theaters.
              </div>
              <div style={{background:C.cardBg,border:`1px solid ${C.border}`,borderRadius:4,padding:"24px 16px 16px"}}>
                <ResponsiveContainer width="100%" height={320}>
                  <LineChart data={CHART} margin={{top:5,right:20,left:0,bottom:5}}>
                    <CartesianGrid strokeDasharray="3 3" stroke="#e0d8cc" />
                    <XAxis dataKey="name" tick={{fontSize:11,fontFamily:"sans-serif"}} />
                    <YAxis tick={{fontSize:11,fontFamily:"sans-serif"}} />
                    <Tooltip contentStyle={{fontFamily:"sans-serif",fontSize:12,background:C.cardBg,border:`1px solid ${C.border}`}} />
                    <Legend iconType="circle" iconSize={8} wrapperStyle={{fontSize:12,fontFamily:"sans-serif",paddingTop:16}} />
                    <Line type="monotone" dataKey="Gulf Total"          stroke={C.brightCrimson} strokeWidth={2.5} dot={{r:5,fill:C.brightCrimson}} />
                    <Line type="monotone" dataKey="Drones / UAVs"       stroke="#8B4513"         strokeWidth={1.8} dot={{r:3.5}} strokeDasharray="6 2" />
                    <Line type="monotone" dataKey="Ballistic Missiles"   stroke={C.navy}          strokeWidth={1.8} dot={{r:3.5}} strokeDasharray="4 3" />
                    <Line type="monotone" dataKey="Cruise Missiles"      stroke={C.olive}         strokeWidth={1.5} dot={{r:3}}   strokeDasharray="2 4" />
                    <Line type="monotone" dataKey="UAE"   stroke="#1B3D7A" strokeWidth={1} dot={false} strokeDasharray="1 3" strokeOpacity={0.5} />
                    <Line type="monotone" dataKey="KSA"   stroke="#1a6b3c" strokeWidth={1} dot={false} strokeDasharray="1 3" strokeOpacity={0.5} />
                    <Line type="monotone" dataKey="Qatar" stroke={C.teal}  strokeWidth={1} dot={false} strokeDasharray="1 3" strokeOpacity={0.5} />
                  </LineChart>
                </ResponsiveContainer>
              </div>
              <div style={{fontSize:10,color:C.gray,marginTop:8,lineHeight:1.6,fontFamily:"sans-serif",fontStyle:"italic"}}>
                Fig. 1 — D+0 peak of 472 reflects simultaneous BM salvoes against UAE, KSA, and Qatar (Al Udeid AB). KSA and Qatar series are open-source estimates. D+17 secondary peak (164 combined) driven by KSA ~95-drone barrage. D+23–D+25 decline coincides with Trump's 5-day diplomatic window following Hormuz ultimatum postponement; Iran denied any talks. D+25 combined ~37 (UAE 12 + KSA 25, excl. Qatar pending) — lowest 2-theater total since D+15 but KSA drone surge (24) contradicts linear decline. Pending days not plotted.
              </div>
            </div>

            {/* ASSESSMENT */}
            <div style={{marginBottom:36}}>
              <SectionLabel>Assessment by Category</SectionLabel>
              <div style={{display:"flex",gap:14,flexWrap:"wrap",marginBottom:14}}>
                <AssessCard color={C.navy} title="Ballistic Missiles — Resumed Decline D+23–D+25"
                  body="The BM series opened at 207 combined launches on D+0 (UAE 137, KSA est. 22, Qatar est. 48) — the largest single-day Iranian BM salvo on record. After initial 98% collapse by D+4, a sustained secondary surge emerged D+17–D+19, peaking at 31 combined BM on D+18. D+22 reversal saw 7 combined BM (UAE 4 + KSA 3 toward Riyadh Province). D+23–D+25 trajectory shows resumed decline: UAE BM fell 7→5→3 across the period; KSA BM dropped from 2 (D+23, targeting Riyadh — 1 fell in inhabited area) to 1 each on D+24–D+25. Combined BM D+25: ~4 (UAE 3 + KSA 1, excl. Qatar pending) vs D+23 combined ~9. UAE MOD cumulative through D+24: 357 BM, 15 CM, 1,806 UAVs. Trump postponed 48-hr Hormuz ultimatum D+23 for 5 days; Iran denied any negotiations. Despite diplomatic window, BM launches continue albeit at reduced rate. Intercept systems: THAAD (UAE/Qatar), Patriot PAC-3 (UAE/KSA/Qatar), Arrow-3 (KSA). Coalition interceptor depletion risk persists — $8bn US arms package to UAE in delivery pipeline." />
                <AssessCard color={C.olive} title="Cruise Missiles — 17 Total (15 UAE + 2 Qatar)"
                  body="15 Ya Ali/Paveh CMs confirmed against UAE through D+25 — no additional CMs since D+11 salvo of 7. All 15 intercepted per UAE MOD. Qatar: 2 CMs on D+12–D+13 confirmed by Qatar MOD. No CMs reported toward KSA. Total CM inventory expenditure (17 confirmed) remains low relative to BM (~370+ est. combined) and UAV (~2,500+ est. combined), consistent with Iran conserving precision stocks. D+23–D+25 saw no new CM launches despite the 5-day diplomatic window created by Trump's Hormuz ultimatum postponement. Iran may be reserving remaining CM inventory as escalation leverage — if the 5-day window collapses and US strikes power plants, CMs against Gulf energy infrastructure (Ras Tanura, Ras Laffan, Jebel Ali) represent Iran's highest-value retaliatory option. The 15-point US peace plan (delivered via Pakistan D+24) reportedly addresses BM/nuclear programs and Hormuz — CM stockpile disposition likely a negotiation factor." />
              </div>
              <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
                <AssessCard color={C.crimson} title="Drones / UAVs — KSA Surge D+25, UAE Decline"
